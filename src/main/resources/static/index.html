<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>GST Reconciliation Tool</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />

    <style>
        body {
          background-color: #f5f7fa;
        }

        .card {
          border-radius: 12px;
        }

        #progressContainer {
          display: none;
        }

        #filterSection {
          display: none;
        }
    </style>
</head>

<body>
<div class="container mt-5">
    <div class="text-center mb-4">
        <h2 class="fw-bold">GST Reconciliation Tool</h2>
        <p class="text-muted">Compare Tally vs GST Portal Excel Data</p>
    </div>

    <!-- TEMPLATE -->
    <div class="mb-3 text-center">
        <a href="/templates/gst-template.xlsx" class="btn btn-sm btn-primary">
            Download Sample Excel Template
        </a>
    </div>

    <!-- UPLOAD CARD -->
    <div class="card shadow-sm p-4">
        <form id="uploadForm">
            <div class="mb-3">
                <label class="form-label">Upload Tally File</label>
                <input type="file" class="form-control" name="tally" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Upload GST File</label>
                <input type="file" class="form-control" name="gst" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Tolerance Limit (0–10)</label>
                <input
                        type="number"
                        class="form-control"
                        name="tolerance"
                        min="0"
                        max="10"
                        step="0.1"
                        value="0"
                        required
                />
            </div>

            <div class="row">
                <div class="col-md-6">
                    <button class="btn btn-primary w-100">Reconcile</button>
                </div>
                <div class="col-md-6">
                    <button
                            type="button"
                            class="btn btn-outline-secondary w-100"
                            onclick="resetAll()"
                    >
                        Reset
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- PROGRESS -->
    <div id="progressContainer" class="mt-4">
        <label class="form-label">Processing...</label>
        <div class="progress">
            <div
                    id="progressBar"
                    class="progress-bar progress-bar-striped progress-bar-animated"
                    style="width: 0%"
            >
                0%
            </div>
        </div>
    </div>

    <!-- RESULT -->
    <div id="result" class="mt-4"></div>

    <!-- FILTER SECTION (Step 2) -->
    <div id="filterSection" class="card p-4 mt-4 shadow-sm">
        <h5 class="text-center mb-3">Post-Reconciliation Filter</h5>

        <div class="mb-3">
            <label class="form-label">Select Field for Matching</label>
            <select id="fieldSelect" class="form-select">
                <option value="taxableValue">Taxable Value</option>
                <option value="igst">IGST</option>
                <option value="cgst">CGST</option>
                <option value="sgst">SGST</option>
            </select>
        </div>

        <button class="btn btn-warning w-100" onclick="runSecondReport()">
            Generate Filtered Report
        </button>
    </div>
</div>

<script>
    let jobId = null;
    let progressInterval;

    // ================= STEP 1 =================
    document
      .getElementById("uploadForm")
      .addEventListener("submit", async function (e) {
        e.preventDefault();

        const formData = new FormData(this);

        document.getElementById("result").innerHTML = "";
        document.getElementById("filterSection").style.display = "none";
        document.getElementById("progressContainer").style.display = "block";

        startFakeProgress();

        try {
          const response = await fetch(
            "/api/reconcile",
            {
              method: "POST",
              body: formData,
            },
          );

          const data = await response.json();

          stopProgress();

          jobId = data.jobId; // IMPORTANT

          showResult(data);

          // show second step UI
          document.getElementById("filterSection").style.display = "block";
        } catch (err) {
          stopProgress();
          document.getElementById("result").innerHTML =
            `<div class="alert alert-danger text-center">Error occurred</div>`;
        }
      });

    // ================= STEP 2 =================
    async function runSecondReport() {
      const field = document.getElementById("fieldSelect").value;
      const btn = document.querySelector("#filterSection button");

      btn.disabled = true;

      document.getElementById("progressContainer").style.display = "block";
      startFakeProgress();

      try {
        const response = await fetch(
          "/api/reconcile/filter",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              jobId: jobId,
              field: field,
            }),
          },
        );

        const data = await response.json();

        stopProgress();
        showFilteredResult(data);
      } catch (err) {
        stopProgress();

        document.getElementById("result").innerHTML =
          `<div class="alert alert-danger text-center">Filter processing failed</div>`;
      } finally {
        btn.disabled = false;
      }
    }
    // ================= RESULT 1 =================
    function showResult(data) {
      document.getElementById("result").innerHTML = `
  <div class="card p-4 shadow-sm">
      <h4 class="text-center mb-4">Reconciliation Summary</h4>

      <div class="row text-center">

          <div class="col-md-4">
              <div class="alert alert-warning">
                  <h3>${data.missingInTally}</h3>
                  Missing in Tally
              </div>
          </div>

          <div class="col-md-4">
              <div class="alert alert-info">
                  <h3>${data.missingInGST}</h3>
                  Missing in GST
              </div>
          </div>

          <div class="col-md-4">
              <div class="alert alert-danger">
                  <h3>${data.mismatches}</h3>
                  Mismatches
              </div>
          </div>

      </div>

      <div class="text-center mt-4">
          <button class="btn btn-success btn-lg"
              onclick="downloadReport('${data.fileName}')">
              ⬇ Download Full Reconciliation Report
          </button>
      </div>

  </div>
`;
    }

    // ================= RESULT 2 =================
    function showFilteredResult(data) {
      document.getElementById("result").innerHTML = `
<div class="card p-4 shadow-sm mt-3">

  <h4 class="text-center mb-3">Filtered Report Ready</h4>

  <div class="text-center">
      <button class="btn btn-success btn-lg"
          onclick="downloadReport('${data.fileName}')">
          ⬇ Download Filtered Report
      </button>
  </div>

</div>
`;
    }

    // ================= DOWNLOAD =================
    function downloadReport(fileName) {
      window.open(
        `/api/download?fileName=${encodeURIComponent(fileName)}`,
        "_blank",
      );
    }

    // ================= PROGRESS =================
    function startFakeProgress() {
      let progress = 0;
      const bar = document.getElementById("progressBar");

      progressInterval = setInterval(() => {
        if (progress < 90) {
          progress += Math.random() * 5;
          progress = Math.min(progress, 90);

          bar.style.width = progress + "%";
          bar.innerText = Math.floor(progress) + "%";
        }
      }, 400);
    }

    function stopProgress() {
      clearInterval(progressInterval);

      const bar = document.getElementById("progressBar");
      bar.style.width = "100%";
      bar.innerText = "100%";

      setTimeout(() => {
        document.getElementById("progressContainer").style.display = "none";
      }, 400);
    }

    // ================= RESET =================
    function resetAll() {
      document.getElementById("uploadForm").reset();
      document.getElementById("result").innerHTML = "";
      document.getElementById("filterSection").style.display = "none";
      document.getElementById("progressContainer").style.display = "none";
      jobId = null;
    }
</script>
</body>
</html>
